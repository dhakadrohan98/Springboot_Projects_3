server.port=8081
spring.application.name=EmailNotificationMicroservice
spring.kafka.consumer.bootstrap-servers=localhost:9092,localhost:9094
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.group-id=product-created-events
#Follow the principle of least privileges
#Allow only those packages from other services(upstream) which classes it used for deserializing messages in this consumer service
spring.kafka.consumer.properties.spring.json.trusted.packages=org.codeship.core.*;
