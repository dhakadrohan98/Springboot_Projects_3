spring.application.name=ProductMicroservice
server.port=8080

#spring.kafka.producer.bootstrap-servers=localhost:9092,localhost:9094
#connect to 3 diff kafka broker through their listeners addresses

spring.kafka.producer.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#Acknowledge messages from all kafka brokers, default value is 1 (to acknowledge message from Leader partition only)
spring.kafka.producer.acks=all

#How many number producer should retry for a failed request
#spring.kafka.producer.retries=10
#spring.kafka.producer.retries=Integr.MAX-VALUE (default value)

#Retry interval: Amount of time producer will wait before attempting to retry for a failed request
#spring.kafka.producer.retry.backoff.ms=1000

#Maximum amount of time producer will wait for response from all replicas (including retry attempts)
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=0 
spring.kafka.producer.properties.request.timeout.ms=30000

#linger.ms → How long should the producer wait to collect messages into a batch?
#request.timeout.ms → How long should the producer wait for a broker's response?
#delivery.timeout.ms → What is the maximum time allowed to deliver a record successfully, including batching, broker acknowledgement and retries?

spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
